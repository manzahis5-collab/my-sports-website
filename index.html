<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Real-time LiveScore Center</title>
    <style>
        body { 
            background-color: #09090b; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            color: #ffffff;
        }
        .web-header { 
            background-color: #18181b; 
            color: #f97316; 
            padding: 20px; 
            text-align: center; 
            font-size: 26px; 
            font-weight: 900; 
            border-bottom: 3px solid #27272a;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(249, 115, 22, 0.4);
        }
        .score-container { 
            max-width: 1000px; 
            margin: 25px auto; 
            padding: 20px; 
            background-color: #18181b; 
            border-radius: 16px; 
            border: 1px solid #27272a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        .footer-note {
            text-align: center;
            color: #52525b;
            font-size: 12px;
            margin-top: 30px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

    <div class="web-header">⚡ REAL-TIME LIVESCORE MATRIX</div>

    <div class="score-container">
        <!-- ตัวโหลดข้อมูลผลบอลสด Real-time อัตโนมัติจากเครือข่าย ScoreAxis อย่างถูกต้อง -->
        <div id="scoreaxis-widget-97424" data-widget="scoreaxis-live-scores" data-theme="dark" data-header="true" data-search="true"></div>
        <script src="https://scoreaxis.com"></script>
    </div>

    <div class="footer-note">
        &copy; 2026 LiveScore Matrix. พัฒนาข้อมูลกีฬาเพื่อความบันเทิงและการศึกษาเท่านั้น
    </div>

</html>
